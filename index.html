<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    window.addEventListener('error', function(e) {
      var root = document.getElementById('root') || document.body;
      var errDiv = document.createElement('div');
      errDiv.style.position = 'fixed';
      errDiv.style.top = '0';
      errDiv.style.left = '0';
      errDiv.style.right = '0';
      errDiv.style.bottom = '0';
      errDiv.style.background = '#fff5f5';
      errDiv.style.color = '#9f1239';
      errDiv.style.padding = '20px';
      errDiv.style.overflow = 'auto';
      errDiv.style.zIndex = '999999';
      errDiv.style.fontFamily = 'monospace';
      errDiv.style.fontSize = '14px';
      errDiv.style.lineHeight = '1.5';
      errDiv.innerHTML = '<h2>🚨 ERROR CRÍTICO DE APLICACIÓN</h2>' +
        '<p><b>Mensaje:</b> ' + e.message + '</p>' +
        '<p><b>Archivo:</b> ' + e.filename + ' (Línea ' + e.lineno + ', Columna ' + e.colno + ')</p>' +
        '<p><b>Stack:</b></p><pre>' + (e.error ? e.error.stack : 'No disponible') + '</pre>' +
        '<p>Por favor, copia este error y envíaselo al asistente para corregirlo de inmediato.</p>';
      root.appendChild(errDiv);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var root = document.getElementById('root') || document.body;
      var errDiv = document.createElement('div');
      errDiv.style.position = 'fixed';
      errDiv.style.top = '0';
      errDiv.style.left = '0';
      errDiv.style.right = '0';
      errDiv.style.bottom = '0';
      errDiv.style.background = '#fff5f5';
      errDiv.style.color = '#9f1239';
      errDiv.style.padding = '20px';
      errDiv.style.overflow = 'auto';
      errDiv.style.zIndex = '999999';
      errDiv.style.fontFamily = 'monospace';
      errDiv.style.fontSize = '14px';
      errDiv.style.lineHeight = '1.5';
      var r = e.reason;
      var rStr = r instanceof Error ? r.message
               : (r && r.type) ? 'Error de red/CDN: ' + r.type + (r.target && r.target.src ? ' — ' + r.target.src : '')
               : (r ? String(r) : 'Desconocida');
      var stack = (r instanceof Error && r.stack) ? r.stack : 'No disponible';
      errDiv.innerHTML = '<h2>🚨 PROMESA RECHAZADA (UNHANDLED REJECTION)</h2>' +
        '<p><b>Razón:</b> ' + rStr + '</p>' +
        '<p><b>Stack:</b></p><pre>' + stack + '</pre>' +
        '<p>Por favor, copia este error y envíaselo al asistente para corregirlo de inmediato.</p>';
      root.appendChild(errDiv);
    });
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Centro de Mando Fitness - Panel inteligente para nutrición, entrenamiento y composición corporal personalizado para Bruno.">
  
  <!-- PWA Configuration -->
  <meta name="theme-color" content="#f5f7f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Centro de Mando Fitness">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">

  <title>Centro de Mando Fitness - Bruno</title>
  
  <!-- Google Fonts: Bebas Neue, Manrope & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Import Map to resolve imports cleanly and prevent multiple React instances -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime?deps=react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
      "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>

  <link rel="stylesheet" href="./style.css?v=20260729-51">
</head>
<body>
  <!-- Root entry point for React -->
  <div id="root"></div>

  <!-- Dynamic Loader with IndexedDB Caching for Instant Page Load -->
  <script>
    (async function() {
      const rootEl = document.getElementById('root');
      
      // Render a premium loader during compilation on first load
      const loaderDiv = document.createElement('div');
      loaderDiv.id = 'app-preloader';
      loaderDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#f5f7f0;color:#1b1f16;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;z-index:999999;transition:opacity 0.3s ease;';
      loaderDiv.innerHTML = `
        <div id="preloader-spin" style="width:40px;height:40px;border:3px solid rgba(77,124,15,0.15);border-top-color:#4d7c0f;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
        <div style="font-size:16px;font-weight:700;letter-spacing:0.05em;color:#4d7c0f;margin-bottom:8px;">BRUNOFIT</div>
        <div id="preloader-status" style="font-size:11px;color:#5f6b57;max-width:240px;text-align:center;line-height:1.4;">Iniciando panel...</div>
        <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
      `;
      rootEl.appendChild(loaderDiv);

      const statusEl = document.getElementById('preloader-status');

      async function getHash(text) {
        const msgBuffer = new TextEncoder().encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-1', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }

      function getCachedCode(hash) {
        return new Promise((resolve) => {
          const request = indexedDB.open('BabelCache', 1);
          request.onupgradeneeded = (e) => {
            e.target.result.createObjectStore('scripts');
          };
          request.onsuccess = (e) => {
            const db = e.target.result;
            const transaction = db.transaction('scripts', 'readonly');
            const store = transaction.objectStore('scripts');
            const getReq = store.get(hash);
            getReq.onsuccess = () => resolve(getReq.result);
            getReq.onerror = () => resolve(null);
          };
          request.onerror = () => resolve(null);
        });
      }

      function cacheCode(hash, code) {
        return new Promise((resolve) => {
          const request = indexedDB.open('BabelCache', 1);
          request.onsuccess = (e) => {
            const db = e.target.result;
            const transaction = db.transaction('scripts', 'readwrite');
            const store = transaction.objectStore('scripts');
            store.clear(); // una sola versión compilada: evita acumular builds viejos
            store.put(code, hash);
            transaction.oncomplete = () => resolve(true);
          };
        });
      }

      function loadBabel() {
        return new Promise((resolve, reject) => {
          if (window.Babel) return resolve();
          statusEl.innerText = "Cargando motor de optimización (solo primer uso)...";
          const script = document.createElement('script');
          script.src = "https://unpkg.com/@babel/standalone/babel.min.js";
          script.crossOrigin = "anonymous";
          script.onload = resolve;
          script.onerror = (ev) => reject(new Error('No se pudo cargar Babel desde CDN (unpkg.com). Verificá tu conexión. src=' + ev.target.src));
          document.head.appendChild(script);
        });
      }

      // La app avisa cuando React ya montó. Sirve para ocultar el loader y,
      // además, para saber si el bundle arrancó de verdad o solo se descargó.
      let arrancada = false;
      window.addEventListener('load-completed', () => {
        arrancada = true;
        loaderDiv.style.opacity = 0;
        setTimeout(() => loaderDiv.remove(), 300);
      });

      // ── Camino rápido: bundle precompilado y autocontenido (npm run build).
      // No necesita Babel ni CDN: la app abre sin conexión y sin compilar nada.
      function loadBundle() {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = './app.bundle.js?v=v2026.07.29-W63';
          script.onload = resolve;
          script.onerror = () => reject(new Error('app.bundle.js no disponible'));
          document.body.appendChild(script);
        });
      }

      // ── Camino de respaldo: compilar app.js en el navegador con Babel.
      async function compileInBrowser() {
        // Fetch app.js source — ?t= busts HF CDN cache; IndexedDB re-uses compiled code if content hash matches
        const res = await fetch('./app.js?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error("No se pudo cargar el archivo app.js");
        const appCode = await res.text();
        const hash = await getHash(appCode);

        let compiledCode = await getCachedCode(hash);

        if (!compiledCode) {
          statusEl.innerText = "Optimizando código de la aplicación (solo primer uso)...";
          await loadBabel();

          compiledCode = Babel.transform(appCode, {
            presets: [['react', { runtime: 'classic' }]],
            filename: 'app.js'
          }).code;

          await cacheCode(hash, compiledCode);
        }

        // Execute transpiled script as a module
        const blob = new Blob([compiledCode], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const moduleScript = document.createElement('script');
        moduleScript.type = 'module';
        moduleScript.src = url;
        document.body.appendChild(moduleScript);
      }

      // Si se agotan todos los caminos hay que decirlo con claridad y dejar una
      // salida. La pantalla roja de "promesa rechazada" es una herramienta de
      // depuración: al usuario le deja la app muerta y sin nada que hacer.
      let falloMostrado = false;
      function mostrarFallo(detalle) {
        if (falloMostrado || arrancada) return;
        falloMostrado = true;
        // Sin esto la ruedita sigue girando y parece que aún carga algo
        const spin = document.getElementById('preloader-spin');
        if (spin) spin.style.display = 'none';
        statusEl.innerHTML =
          '<div style="color:#be123c;font-size:13px;font-weight:800;margin-bottom:6px">No se pudo cargar la aplicación</div>' +
          '<div style="color:#5f6b57;line-height:1.5">Revisá tu conexión y reintentá. Tus datos están guardados en el teléfono: no se pierde nada.</div>' +
          '<div style="color:#8a917f;font-size:9px;margin-top:10px;word-break:break-word">' + String(detalle || '').slice(0, 140) + '</div>';
        const btn = document.createElement('button');
        btn.textContent = 'Reintentar';
        btn.style.cssText = 'margin-top:16px;padding:10px 24px;border-radius:10px;border:none;background:#4d7c0f;color:#ffffff;font-weight:800;font-size:13px;cursor:pointer';
        btn.onclick = () => location.reload();
        loaderDiv.appendChild(btn);
      }
      // Red de seguridad para cualquier camino que se quede colgado sin fallar
      setTimeout(() => mostrarFallo('la aplicación no respondió a tiempo'), 25000);

      try {
        await loadBundle();
        if (!arrancada) throw new Error('el bundle se cargó pero no montó la app');
      } catch (errBundle) {
        console.warn('Sin bundle utilizable, se compila en el navegador:', errBundle.message);
        statusEl.innerText = "Preparando la aplicación...";
        try {
          await compileInBrowser();
        } catch (err) {
          console.error("Error en cargador IndexedDB/Babel:", err);
          statusEl.innerHTML = `<span style="color:#be123c">Error al iniciar: ${err.message}</span><br>Cargando en modo lento de respaldo...`;
          try {
            // Fallback: load Babel standalone normally and load app.js
            await loadBabel();
            const fallbackScript = document.createElement('script');
            fallbackScript.type = 'text/babel';
            fallbackScript.setAttribute('data-type', 'module');
            fallbackScript.src = './app.js';
            document.body.appendChild(fallbackScript);
          } catch (errFinal) {
            // Sin este catch la promesa se escapa y salta la pantalla roja de
            // "PROMESA RECHAZADA", que no explica nada ni deja reintentar
            mostrarFallo(errFinal.message || err.message);
          }
        }
      }
    })();
  </script>

  <!-- Register Service Worker for PWA installability -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
